name: paddle-build
on:
  push:
    branches:
      - sdcb/3.2
      - sdcb/3.3
    paths:
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      target:
        description: "Run single matrix entry: <os>/<name> (e.g. windows-2022/openblas)"
        required: false
        default: ""
      linux_only:
        description: "Only run Linux docker jobs (for faster debugging)"
        required: false
        default: "false"

env:
  PADDLE_VERSION: "3.3.0"

concurrency:
  group: paddle-build-${{ github.ref }}-${{ github.event_name }}-${{ github.event.inputs.target || 'all' }}
  cancel-in-progress: true

jobs:
  prepare-matrix:
    runs-on: ubuntu-22.04
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - name: Select build matrix
        id: set
        shell: bash
        env:
          TARGET: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target || '' }}
          LINUX_ONLY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.linux_only || 'false' }}
        run: |
          python - <<'PY'
          import json, os

          target = (os.environ.get('TARGET') or '').strip()
          full = [
            {"os": "windows-2022",     "name": "openblas_noavx",       "cmake_flags": "-DWITH_AVX=OFF -DWITH_MKL=OFF -DWITH_ONNXRUNTIME=ON"},
            {"os": "windows-2022",     "name": "openblas",             "cmake_flags": "-DWITH_MKL=OFF -DWITH_ONNXRUNTIME=ON"},
            {"os": "windows-2022",     "name": "mkldnn",               "cmake_flags": "-DWITH_MKL=ON -DWITH_ONNXRUNTIME=ON"},
            {"os": "windows-2022",     "name": "cu129_cudnn910_sm61",  "cuda": "12.9.0", "cudnn": "9.10.1.4", "cmake_flags": "-DWITH_GPU=ON -DCUDA_ARCH_NAME=Manual -DCUDA_ARCH_BIN=\"61\"  -DWITH_ONNXRUNTIME=ON"},
            {"os": "windows-2022",     "name": "cu129_cudnn910_sm75",  "cuda": "12.9.0", "cudnn": "9.10.1.4", "cmake_flags": "-DWITH_GPU=ON -DCUDA_ARCH_NAME=Manual -DCUDA_ARCH_BIN=\"75\"  -DWITH_ONNXRUNTIME=ON"},
            {"os": "windows-2022",     "name": "cu129_cudnn910_sm86",  "cuda": "12.9.0", "cudnn": "9.10.1.4", "cmake_flags": "-DWITH_GPU=ON -DCUDA_ARCH_NAME=Manual -DCUDA_ARCH_BIN=\"86\"  -DWITH_ONNXRUNTIME=ON"},
            {"os": "windows-2022",     "name": "cu129_cudnn910_sm89",  "cuda": "12.9.0", "cudnn": "9.10.1.4", "cmake_flags": "-DWITH_GPU=ON -DCUDA_ARCH_NAME=Manual -DCUDA_ARCH_BIN=\"89\"  -DWITH_ONNXRUNTIME=ON"},
            {"os": "windows-2022",     "name": "cu129_cudnn910_sm120", "cuda": "12.9.0", "cudnn": "9.10.1.4", "cmake_flags": "-DWITH_GPU=ON -DCUDA_ARCH_NAME=Manual -DCUDA_ARCH_BIN=\"120\" -DWITH_ONNXRUNTIME=ON"},
            {"os": "ubuntu-22.04",     "name": "openblas",             "docker_image": "oraclelinux:7", "cmake_flags": "-DWITH_MKL=OFF -DWITH_ONNXRUNTIME=ON"},
            {"os": "ubuntu-22.04",     "name": "mkldnn",               "docker_image": "oraclelinux:7", "cmake_flags": "-DWITH_MKL=ON -DWITH_ONNXRUNTIME=ON"},
            {"os": "ubuntu-22.04",     "name": "openvino",             "docker_image": "oraclelinux:7", "cmake_flags": "-DWITH_MKL=ON -DWITH_OPENVINO=ON -DWITH_ONNXRUNTIME=ON"},
            {"os": "ubuntu-22.04-arm", "name": "openblas",             "docker_image": "oraclelinux:7", "cmake_flags": "-DWITH_ARM=ON -DCMAKE_CXX_FLAGS=-Wno-error=class-memaccess"},
            {"os": "macos-15",         "name": "openblas",             "cmake_flags": "-DWITH_ARM=ON"},
          ]

          if target:
            if '/' not in target:
              raise SystemExit(f"Invalid TARGET {target!r}, expected <os>/<name>")
            os_name, name = target.split('/', 1)
            full = [m for m in full if m.get('os') == os_name and m.get('name') == name]
            if not full:
              raise SystemExit(f"No matrix entry matched TARGET {target!r}")

          # Optional: debug only Linux docker builds
          linux_only = (os.environ.get('LINUX_ONLY') or '').strip().lower() in ('1','true','yes','on')
          if linux_only:
            full = [m for m in full if m.get('os','').startswith('ubuntu-')]

          include = json.dumps(full, separators=(',', ':'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
            f.write(f"include={include}\n")
          print('matrix entries:', len(full))
          PY

  build-all:
    needs: prepare-matrix
    runs-on: ${{ matrix.os }}

    strategy:
      # For workflow_dispatch (debug runs) fail fast to save time.
      fail-fast: ${{ github.event_name == 'workflow_dispatch' }}
      matrix:
        include: ${{ fromJSON(needs.prepare-matrix.outputs.include) }}
    steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Setup dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ "${{ runner.os }}" = "Windows" ]; then
          # Newer ninja wheels occasionally regress on huge response files on Windows.
          # Pin to a known-good version.
          python -m pip install numpy protobuf wheel ninja==1.11.1.4
        else
          python -m pip install numpy protobuf wheel ninja
        fi
        ninja --version

    - name: Install system deps (Linux)
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y patchelf

    - uses: Jimver/cuda-toolkit@v0.2.24
      if: ${{ matrix.cuda }}
      id: cuda-toolkit
      with:
        method: network
        cuda: ${{ matrix.cuda }}
        # Windows sub-packages are kind of different, so we need to handle them separately
        # https://docs.nvidia.com/cuda/cuda-installation-guide-microsoft-windows/index.html
        sub-packages: ${{ matrix.os == 'ubuntu-22.04' && 
          '["nvcc"]' || 
          '["nvcc", "cublas", "cublas_dev", "cudart", "cufft", "cufft_dev", "curand", "curand_dev", 
            "cusparse", "cusparse_dev", "cusolver", "cusolver_dev", "nvrtc", "nvrtc_dev", 
            "cuda_profiler_api", "nvjpeg", "nvjpeg_dev", "thrust"]' 
          }}
        non-cuda-sub-packages: ${{ matrix.os == 'ubuntu-22.04' && 
          '["libcublas", "libcublas-dev", "libcufft", "libcufft-dev", "libcurand", "libcurand-dev", 
            "libcusparse", "libcusparse-dev", "libcusolver", "libcusolver-dev", "libnvrtc", 
            "libnvrtc-dev", "profiler_api", "libthrust"]' || 
          '[]' }}
        log-file-suffix: ${{ runner.os }}.txt
    
    - name: Download cuDNN
      if: ${{ matrix.cudnn }}
      shell: pwsh
      run: |
        $cudaMajor = '${{ matrix.cuda }}'.Split('.')[0]
        echo "Downloading cuDNN for CUDA $cudaMajor and cuDNN ${{ matrix.cudnn }}..."
        if ("${{ runner.os }}" -eq "Linux") {
          Invoke-WebRequest -Uri https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/linux-x86_64/cudnn-linux-x86_64-${{ matrix.cudnn }}_cuda$cudaMajor-archive.tar.xz -OutFile cudnn.tar.xz
          mkdir cudnn && tar -xf cudnn.tar.xz --strip-components=1 -C cudnn

          sudo cp cudnn/include/* ${{steps.cuda-toolkit.outputs.CUDA_PATH}}/include/
          sudo cp cudnn/lib/* ${{steps.cuda-toolkit.outputs.CUDA_PATH}}/lib64/
        } elseif ("${{ runner.os }}" -eq "Windows") {
          Invoke-WebRequest -Uri https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/windows-x86_64/cudnn-windows-x86_64-${{ matrix.cudnn }}_cuda$cudaMajor-archive.zip -OutFile cudnn.zip
          mkdir cudnn && tar -xf cudnn.zip --strip-components=1 -C cudnn

          cp -Recurse -Force cudnn\* "${{ steps.cuda-toolkit.outputs.CUDA_PATH }}"
        }
    
        echo "::group:: cuDNN files"
        Get-ChildItem -Recurse cudnn
        echo "::endgroup::"

    - name: Checkout Paddle repo
      uses: actions/checkout@v4
      with:
        path: paddle-src

    - name: Use GitHub mirror for pocketfft (avoid GitLab flakiness)
      shell: bash
      run: |
        git config -f paddle-src/.gitmodules submodule.third_party/pocketfft.url https://github.com/mreineck/pocketfft.git
        git -C paddle-src submodule sync --recursive

    - name: Pull Docker Image (Linux)
      if: ${{ runner.os == 'Linux' && matrix.docker_image }}
      shell: bash
      run: |
        docker --version
        docker pull "${{ matrix.docker_image }}"

    - name: Start Docker Container (Linux)
      if: ${{ runner.os == 'Linux' && matrix.docker_image }}
      shell: bash
      run: |
        docker rm -f builder 2>/dev/null || true
        docker run -d --name builder \
          -v "$GITHUB_WORKSPACE:/workspace" \
          -w /workspace \
          -e GITHUB_TOKEN="${{ github.token }}" \
          -e GITHUB_API_URL="${{ github.api_url }}" \
          "${{ matrix.docker_image }}" \
          tail -f /dev/null

    - name: Initialize Docker Container (Linux)
      if: ${{ runner.os == 'Linux' && matrix.docker_image }}
      shell: bash
      run: |
        docker exec -i builder bash -s <<'EOS'
        set -eux

        if [ -f /etc/oracle-release ]; then
          cat /etc/oracle-release
        fi

        if command -v yum >/dev/null 2>&1; then
          yum install -y yum-utils || true
          yum install -y oracle-epel-release-el7 || true
          yum-config-manager --enable ol7_developer_EPEL || true
          yum-config-manager --enable ol7_developer_epel || true
        fi
        EOS

    - name: Install Build Dependencies (Linux in Docker)
      if: ${{ runner.os == 'Linux' && matrix.docker_image }}
      shell: bash
      run: |
        docker exec -i builder bash -s <<'EOS'
        set -eux
        yum makecache -y || true

        # Basic toolchain
        yum install -y git make which file tar xz bzip2 gzip patch || true
        yum install -y patchelf || true
        yum install -y gcc gcc-c++ || true

        # Newer compilers (best-effort; repo/package names vary)
        yum install -y oraclelinux-developer-release-el7 || true
        yum install -y oracle-softwarecollection-release-el7 || true
        yum install -y gcc-toolset-11-gcc gcc-toolset-11-gcc-c++ gcc-toolset-11-binutils || true
        yum install -y gcc-toolset-10-gcc gcc-toolset-10-gcc-c++ gcc-toolset-10-binutils || true
        yum install -y devtoolset-11-gcc devtoolset-11-gcc-c++ devtoolset-11-binutils || true
        yum install -y devtoolset-10-gcc devtoolset-10-gcc-c++ devtoolset-10-binutils || true
        yum install -y devtoolset-9-gcc devtoolset-9-gcc-c++ devtoolset-9-binutils || true

        # CMake + Ninja
        # Paddle 3.3 requires CMake >= 3.18; EL7 repos often provide 3.17.
        # Use official Kitware prebuilt CMake to keep glibc low (CentOS7 compatible).
        yum install -y ninja-build || yum install -y ninja || true
        yum install -y curl ca-certificates || true

        CMAKE_VER=3.27.9
        ARCH=$(uname -m)
        if [ "$ARCH" = "x86_64" ]; then
          CMAKE_PKG=cmake-$CMAKE_VER-linux-x86_64
        elif [ "$ARCH" = "aarch64" ]; then
          CMAKE_PKG=cmake-$CMAKE_VER-linux-aarch64
        else
          echo "Unsupported arch: $ARCH" >&2
          exit 1
        fi
        curl -fsSL -o /tmp/cmake.tgz "https://github.com/Kitware/CMake/releases/download/v$CMAKE_VER/$CMAKE_PKG.tar.gz"
        rm -rf /opt/cmake && mkdir -p /opt/cmake
        tar -xzf /tmp/cmake.tgz -C /opt/cmake --strip-components=1
        ln -sf /opt/cmake/bin/cmake /usr/local/bin/cmake
        ln -sf /opt/cmake/bin/ctest /usr/local/bin/ctest
        ln -sf /opt/cmake/bin/cpack /usr/local/bin/cpack

        # Python (Paddle build uses Python for codegen even with WITH_PYTHON=OFF)
        yum install -y python3 python3-pip || true

        # EL7 python3 is usually 3.6 which is too old for Paddle 3.3 codegen.
        # Install a newer CPython built for glibc (CentOS7 compatible) from python-build-standalone.
        if python3 - <<'PY'
        import sys
        raise SystemExit(0 if sys.version_info >= (3, 9) else 1)
        PY
        then
          echo "python3 is new enough"
        else
          python3 - <<'PY' > /tmp/py_url
        import json, os, urllib.request

        arch = os.uname().machine
        suffix = {
          'x86_64': 'x86_64-unknown-linux-gnu-install_only.tar.gz',
          'aarch64': 'aarch64-unknown-linux-gnu-install_only.tar.gz',
        }.get(arch)
        if not suffix:
          raise SystemExit(f'unsupported arch: {arch}')

        api_url = os.environ.get('GITHUB_API_URL') or 'https://api.github.com'
        token = os.environ.get('GITHUB_TOKEN')
        headers = {'Accept': 'application/vnd.github+json', 'User-Agent': 'paddle-build'}
        if token:
          headers['Authorization'] = f'Bearer {token}'

        req = urllib.request.Request(
          api_url.rstrip('/') + '/repos/indygreg/python-build-standalone/releases/latest',
          headers=headers,
        )
        data = json.load(urllib.request.urlopen(req, timeout=60))
        assets = data.get('assets', [])

        def pick(major_minor):
          for a in assets:
            n = a.get('name', '')
            if n.startswith(f'cpython-{major_minor}') and n.endswith(suffix):
              return a['browser_download_url']
          return None

        # prefer 3.10 because it is widely available for glibc builds
        url = pick('3.10') or pick('3.11') or pick('3.9')
        if not url:
          raise SystemExit('no suitable python-build-standalone asset found')
        print(url)
        PY

          curl -fsSL -o /tmp/python.tgz "$(cat /tmp/py_url)"
          rm -rf /opt/python && mkdir -p /opt/python
          tar -xzf /tmp/python.tgz -C /opt/python --strip-components=1
          /opt/python/bin/python3 -m ensurepip || true
          /opt/python/bin/python3 -m pip install --upgrade pip setuptools wheel
          ln -sf /opt/python/bin/python3 /usr/local/bin/python3
          ln -sf /opt/python/bin/pip3 /usr/local/bin/pip3
        fi

        command -v gcc
        command -v g++
        command -v cmake
        command -v ninja
        command -v python3

        cmake --version
        ninja --version
        python3 --version
        EOS

    - uses: ilammy/msvc-dev-cmd@v1
      if: ${{ runner.os == 'Windows' }}
      with:
        toolset: '14.29'

    - name: Configure with CMake
      if: ${{ runner.os != 'Linux' }}
      shell: pwsh
      run: |
        mkdir ./paddle-src/build
        mkdir ./paddle-src/build/paddle/phi/ops/yaml/inconsistent
        mkdir ./paddle-src/build/paddle/phi/ops/yaml/legacy

        cd ./paddle-src/build

        cmake .. -GNinja `
          ${{ matrix.cmake_flags }} `
          -DON_INFER=ON `
          -DWITH_PYTHON=OFF `
          -DWITH_UNITY_BUILD=ON

    - name: Build with Ninja
      if: ${{ runner.os != 'Linux' }}
      run: |
        cd ./paddle-src/build
        ninja all

    - name: Configure and Build in Docker (Linux)
      if: ${{ runner.os == 'Linux' && matrix.docker_image }}
      shell: bash
      run: |
        # Quote the heredoc delimiter to prevent the *host* bash from expanding
        # $VARS / $(cmd) before the script reaches the container.
        docker exec -i builder bash -s <<'EOS'
        set -eux
        export MANPATH="${MANPATH:-}"
        if [ -f /opt/rh/gcc-toolset-11/enable ]; then source /opt/rh/gcc-toolset-11/enable; fi
        if [ -f /opt/rh/gcc-toolset-10/enable ]; then source /opt/rh/gcc-toolset-10/enable; fi
        if [ -f /opt/rh/devtoolset-11/enable ]; then source /opt/rh/devtoolset-11/enable; fi
        if [ -f /opt/rh/devtoolset-10/enable ]; then source /opt/rh/devtoolset-10/enable; fi
        if [ -f /opt/rh/devtoolset-9/enable ]; then source /opt/rh/devtoolset-9/enable; fi
        gcc --version || true
        cmake --version
        ninja --version

        python3 -m pip install --upgrade pip
        python3 -m pip install numpy protobuf wheel

        mkdir -p ./paddle-src/build
        mkdir -p ./paddle-src/build/paddle/phi/ops/yaml/inconsistent
        mkdir -p ./paddle-src/build/paddle/phi/ops/yaml/legacy

        cd ./paddle-src/build
        cmake .. -GNinja ${{ matrix.cmake_flags }} -DON_INFER=ON -DWITH_PYTHON=OFF -DWITH_UNITY_BUILD=ON -DPYTHON_EXECUTABLE=/usr/local/bin/python3
        ninja all

        # Post-process for Linux inside container (avoid host write-permission issues)
        cp ./paddle_inference_install_dir/paddle/lib/*common.* ./paddle_inference_c_install_dir/paddle/lib/ || true
        cp ./paddle_inference_install_dir/paddle/lib/*phi* ./paddle_inference_c_install_dir/paddle/lib/ || true

        LIB=./paddle_inference_c_install_dir/paddle/lib/libpaddle_inference_c.so
        echo "Before RPATH:" && patchelf --print-rpath "$LIB" || true
        patchelf --set-rpath '$ORIGIN' "$LIB"
        echo "After  RPATH:" && patchelf --print-rpath "$LIB" || true

        if find /workspace -type f -name 'libmklml_intel.so' -print -quit | grep -q .; then
          echo "libmklml_intel.so found, patching libpaddle_inference_c.so..."
          patchelf --add-needed libmklml_intel.so "$LIB" || true
        else
          echo "libmklml_intel.so not found, skip patchelf add-needed."
        fi

        chmod -R a+rX ./paddle_inference_install_dir ./paddle_inference_c_install_dir || true
        EOS

    - name: Stop Docker Container (Linux)
      if: ${{ runner.os == 'Linux' && matrix.docker_image && always() }}
      shell: bash
      run: |
        docker rm -f builder || true

    - name: Show build files
      shell: bash
      run: |
        ls -lR ./paddle-src/build

    - name: Upload paddle_inference_install_dir
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}_cpp_${{ matrix.name }}
        path: ./paddle-src/build/paddle_inference_install_dir/*
    
    - name: Patch RPATH / install-name for Paddle
      if: ${{ runner.os != 'Windows' && !(runner.os == 'Linux' && matrix.docker_image) }}
      shell: bash
      run: |    
        case "${{ runner.os }}" in    
          Linux)
            echo "Before:"
            LIB=./paddle-src/build/paddle_inference_c_install_dir/paddle/lib/libpaddle_inference_c.so
            patchelf --print-rpath $LIB || true    
            chmod u+w $LIB || true
            patchelf --set-rpath '$ORIGIN' $LIB
    
            echo "After :"
            patchelf --print-rpath $LIB

            if find . -type f -name 'libmklml_intel.so' -print -quit | grep -q .; then
              echo "libmklml_intel.so found, patching libpaddle_inference_c.so..."
              patchelf --add-needed libmklml_intel.so ./paddle-src/build/paddle_inference_c_install_dir/paddle/lib/libpaddle_inference_c.so
            else
              echo "libmklml_intel.so not found, skip patchelf."
            fi
            ;;
    
          macOS)
            dylib=./paddle-src/build/paddle_inference_c_install_dir/paddle/lib/libpaddle_inference_c.dylib
    
            echo "Before:"
            otool -l "$dylib" | grep -A2 LC_RPATH || true
    
            install_name_tool -id @rpath/$(basename "$dylib") "$dylib"
            install_name_tool -add_rpath @loader_path "$dylib" 2>/dev/null || true
    
            echo "After :"
            otool -l "$dylib" | grep -A2 LC_RPATH
            ;;
    
          *)
            echo "no rpath patch needed for ${{ matrix.rid }}"
            ;;
        esac
    
        echo "RPATH / LC_RPATH patched successfully."

    - name: Post process paddle_inference_install_dir
      if: ${{ !(runner.os == 'Linux' && matrix.docker_image) }}
      shell: bash
      run: |
        cp ./paddle-src/build/paddle_inference_install_dir/paddle/lib/*common.* ./paddle-src/build/paddle_inference_c_install_dir/paddle/lib/
        cp ./paddle-src/build/paddle_inference_install_dir/paddle/lib/*phi* ./paddle-src/build/paddle_inference_c_install_dir/paddle/lib/ || true
        ls -lR ./paddle-src/build/paddle_inference_install_dir

    - name: Upload paddle_inference_c_install_dir
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}_c_${{ matrix.name }}
        path: ./paddle-src/build/paddle_inference_c_install_dir/*
